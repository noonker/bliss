# ~/.config/bliss/config.toml  (or point BLISS_CONFIG at a file)

# "here" always exists and needs no settings: it runs in place on this machine, in a
# session on its own tmux server (`tmux -L bliss ls`). Define it only to use screen.
# [targets.here]
# type = "here"
# session = "screen"

[targets.local]
type = "podman"                 # or "docker"
# command = ["podman", "--remote", "--connection", "gpu-box"]
# run_args = ["--device", "nvidia.com/gpu=all"]

[targets.box]
type = "ssh"
host = "me@server.example.com"  # anything ssh accepts, including ~/.ssh/config names
session = "tmux"                # or "screen"; must be installed on the server

[targets.cluster]
type = "kubernetes"
kind = "pod"                    # or "deployment"
registry = "registry.example.com/me"   # required: the cluster pulls from here
# pull_registry = "10.0.0.5:5000"      # if the cluster reaches that registry at another address
# context = "admin@cluster"
# namespace = "default"
# image_pull_secret = "regcred"
# push_args = ["--tls-verify=false"]
# builder = ["podman"]
# resources = { limits = { memory = "2Gi" } }

# By default bliss refuses to send a directory that is not inside a git repository.
# Set this to true to allow sending any directory without that check.
# allow_untracked_dir = true

[env]
# The whole environment travels except session variables (DISPLAY, SSH_AUTH_SOCK...).
# Use `bliss run -n` to see the names that would be sent.
exclude = ["AWS_*", "*_PASSWORD"]
# include = ["DISPLAY"]         # wins over the built-in and `exclude` lists

[ai]
agent = "claude"                # or "autolith", "hermes", "pi"
unattended = false              # true: agents act without approval prompts

# Each agent can be pinned or have its commands changed. A "{prompt}" element
# is replaced with the prompt as one argument, and only as a whole element.
[agents.claude]
# version = "2.1.317"
# prompt = ["claude", "-p", "{prompt}", "--model", "opus"]
#
# Send a login along. Off unless listed, and only for claude and pi. Anyone with
# root on the target, or who can read Secrets in the namespace, can use it.
# credentials = ["~/.claude/.credentials.json"]
#
# [agents.pi]
# credentials = ["~/.pi/agent/auth.json"]
